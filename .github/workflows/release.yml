name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targets:
    name: Discover release targets
    uses: ./.github/workflows/targets.yml
  build:
    name: Build (${{ matrix.arch }})
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      ELF_CLASS: ${{ matrix.elf }}
      MACHINE: ${{ matrix.machine }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Version
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "$tag"
          fi
          printf 'TAG=%s\n' "$tag" >> "$GITHUB_ENV"
      - name: Setup Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake
      - name: Verify Source
        run: sha256sum -c SHA256SUMS
      - name: Compile
        env:
          TARGET_FLAGS: ${{ matrix.flags }}
        run: |
          cmake -S . -B build/release \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_COMPILER_TARGET="$TARGET" \
            -DCMAKE_C_FLAGS="$TARGET_FLAGS -Werror" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release --parallel 2
      - name: Stage Distribution
        env:
          TARGET_FLAGS: ${{ matrix.flags }}
        run: |
          mkdir -p package/lib build/verify
          mapfile -d '' objects < <(find build/release/CMakeFiles/rei_kernel.dir -type f -name '*.o' -print0 | sort -z)
          test "${#objects[@]}" -gt 0
          llvm-ar rcsD package/lib/librei.a "${objects[@]}"
          test -s package/lib/librei.a
          cp -R include croissant.manifest.json LICENSE VERSION package/
          clang --version > package/COMPILER.txt
          printf '\nTarget: %s\nTarget flags: %s\n' "$TARGET" "$TARGET_FLAGS" >> package/COMPILER.txt
          for i in "${!objects[@]}"; do cp "${objects[$i]}" "build/verify/$i.o"; done
      - name: Record Upstream Target Policy
        env:
          TARGET_POLICY: ${{ needs.targets.outputs.matrix }}
          TARGET_REVISION: ${{ needs.targets.outputs.revision }}
          TARGET_PROFILE: ${{ toJSON(matrix) }}
        run: |
          jq . <<< "$TARGET_POLICY" > package/TARGETS.json
          jq . <<< "$TARGET_PROFILE" > package/TARGET.json
          printf 'kittycrow-kittyx/croissant@%s\n' "$TARGET_REVISION" > package/TARGETS_REVISION
      - name: Verify Architecture
        run: |
          shopt -s nullglob
          objects=(build/verify/*.o)
          test "${#objects[@]}" -gt 0
          for object in "${objects[@]}"; do
            header="$(LC_ALL=C readelf -h "$object")"
            machine="$(printf '%s\n' "$header" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
            class="$(printf '%s\n' "$header" | sed -n 's/^[[:space:]]*Class:[[:space:]]*//p')"
            test "$machine" = "$MACHINE"
            test "$class" = "$ELF_CLASS"
          done
      - name: Package
        run: |
          mkdir -p dist
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" \
            --owner=0 --group=0 --numeric-owner \
            -czf "dist/rei-$TAG-$ARCH.tar.gz" -C package .
          tar -tzf "dist/rei-$TAG-$ARCH.tar.gz"
      - name: Upload Release Artefact
        uses: actions/upload-artifact@v6
        with:
          name: rei-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [targets, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Release Artefacts
        uses: actions/download-artifact@v7
        with:
          pattern: rei-*
          path: release
          merge-multiple: true
      - name: Generate Checksums
        env:
          TARGET_POLICY: ${{ needs.targets.outputs.matrix }}
        run: |
          set -euo pipefail
          cd release
          mapfile -t architectures < <(jq -er '.include[].arch' <<< "$TARGET_POLICY")
          test "${#architectures[@]}" -gt 0
          expected=()
          for arch in "${architectures[@]}"; do
            archive="rei-$GITHUB_REF_NAME-$arch.tar.gz"
            test -s "$archive"
            expected+=("$archive")
          done
          shopt -s nullglob
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq "${#expected[@]}"
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS \
            --verify-tag --generate-notes --title "Rei $GITHUB_REF_NAME"
