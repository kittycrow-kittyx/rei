name: Kernel source and build validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targets:
    name: Discover validation targets
    uses: ./.github/workflows/targets.yml
  source:
    name: Transpile source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Transpile source from pinned toolchain
        run: bash scripts/regenerate.sh
      - name: Upload generated source
        uses: actions/upload-artifact@v6
        with:
          name: rei-generated-source
          path: |
            src/
            include/
            CMakeLists.txt
            croissant.manifest.json
            docs/bake-manifest.json
            SHA256SUMS
          if-no-files-found: error
  compile:
    name: Compile (${{ matrix.arch }})
    needs: [source, targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove old generated source
        run: rm -rf src include
      - name: Download generated source
        uses: actions/download-artifact@v7
        with:
          name: rei-generated-source
          path: .
      - name: Verify generated source
        run: |
          test -z "$(git ls-files -- dist platform '*.o' '*.a' '*.so' '*.elf' '*.img' '*.bin' '*.wasm' '*.rlib')"
          sha256sum -c SHA256SUMS
          bash scripts/verify-pins.sh
      - name: Compile freshly generated source
        shell: bash
        env:
          TARGET_FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          read -r -a target_flags <<< "$TARGET_FLAGS"
          mapfile -d '' sources < <(find src -type f -name '*.c' -print0 | sort -z)
          test "${#sources[@]}" -gt 0
          for source in "${sources[@]}"; do
            output="build/regenerated-cross/$TARGET/${source#src/}.o"
            mkdir -p "$(dirname "$output")"
            clang --target="$TARGET" "${target_flags[@]}" -std=c11 -O1 -ffreestanding -fno-builtin -fno-stack-protector -Werror -Iinclude -c "$source" -o "$output"
          done
      - name: Verify committed source matches regeneration
        run: |
          git add -A -- src include CMakeLists.txt croissant.manifest.json docs/bake-manifest.json SHA256SUMS
          git diff --cached --exit-code
