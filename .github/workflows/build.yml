name: Kernel source and build validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targets:
    name: Discover validation targets
    uses: ./.github/workflows/targets.yml
    with:
      source_sha: ${{ github.sha }}
  source:
    name: Transpile source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Verify build scripts
        run: for script in scripts/*.sh; do bash -n "$script" || exit; done
      - name: Verify upstream pins
        run: bash scripts/verify-pins.sh
      - name: Download upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-upstream.sh
      - name: Install upstream dependencies
        run: |
          bun install --cwd build/upstream/croissant --frozen-lockfile
          bun install --cwd build/upstream/croissant/bake --frozen-lockfile
      - name: Transpile source
        run: bash scripts/regenerate.sh --source-only
      - name: Upload generated source
        uses: actions/upload-artifact@v6
        with:
          name: rei-generated-source
          path: |
            src/
            include/
            CMakeLists.txt
            croissant.manifest.json
            docs/bake-manifest.json
            docs/provenance.md
            SHA256SUMS
          if-no-files-found: error
  compile:
    name: Compile (${{ matrix.arch }})
    needs: [source, targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Remove old generated source
        run: rm -rf src include
      - name: Download generated source
        uses: actions/download-artifact@v7
        with:
          name: rei-generated-source
          path: .
      - name: Verify generated source
        run: bash scripts/verify-source.sh
      - name: Compile C
        shell: bash
        env:
          TARGET_FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          read -r -a target_flags <<< "$TARGET_FLAGS"
          mapfile -d '' sources < <(find src -type f -name '*.c' -print0 | sort -z)
          test "${#sources[@]}" -gt 0
          for source in "${sources[@]}"; do
            output="build/regenerated-cross/$TARGET/${source#src/}.o"
            mkdir -p "$(dirname "$output")"
            clang --target="$TARGET" "${target_flags[@]}" -std=c11 -O1 -ffreestanding -fno-builtin -fno-stack-protector -Werror -Iinclude -c "$source" -o "$output"
          done
      - name: Verify committed source matches regeneration
        run: |
          git add -A -- src include CMakeLists.txt croissant.manifest.json docs/bake-manifest.json docs/provenance.md SHA256SUMS
          git diff --cached --exit-code
