name: Rei source and build validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate C source from pinned toolchain
        run: bash scripts/regenerate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rei-generated-source
          path: |
            src/
            include/
            CMakeLists.txt
            croissant.manifest.json
            docs/bake-manifest.json
            SHA256SUMS
          if-no-files-found: error
      - name: Build freshly regenerated C for host and bare-metal targets
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/regenerated-native
          cmake --build build/regenerated-native --parallel 2
          for triple in x86_64-unknown-none-elf aarch64-none-elf; do
            while IFS= read -r -d '' source; do
              output="build/regenerated-cross/$triple/${source#src/}.o"
              mkdir -p "$(dirname "$output")"
              clang --target="$triple" -std=c11 -O1 -ffreestanding -fno-builtin -fno-stack-protector -Werror -Iinclude -c "$source" -o "$output"
            done < <(find src -type f -name '*.c' -print0)
          done
      - name: Verify committed source matches regeneration
        run: |
          git add -A -- src include CMakeLists.txt croissant.manifest.json docs/bake-manifest.json SHA256SUMS
          git diff --cached --exit-code
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-only checkout
        run: |
          test -z "$(git ls-files -- dist platform '*.o' '*.a' '*.so' '*.elf' '*.img' '*.bin' '*.wasm' '*.rlib')"
          sha256sum -c SHA256SUMS
          bash scripts/verify-pins.sh
      - name: Compile without publishing binaries to Git
        run: |
          cmake -S . -B build
          cmake --build build --parallel 2
          git diff --exit-code
      - name: Validate freestanding cross-compilation
        shell: bash
        run: |
          set -euo pipefail
          for triple in x86_64-unknown-none-elf aarch64-none-elf; do
            while IFS= read -r -d '' source; do
              output="build/cross/$triple/${source#src/}.o"
              mkdir -p "$(dirname "$output")"
              clang --target="$triple" -std=c11 -O1 -ffreestanding -fno-builtin -fno-stack-protector -Werror -Iinclude -c "$source" -o "$output"
            done < <(find src -type f -name '*.c' -print0)
          done
